<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Buff Code</title>
    <link rel="icon" type="image/png" href="./favicon-96x96-v3.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./favicon-v3.svg" />
    <script id="buff-theme-boot"></script>
    <!-- Buff (#596): the splash brain — a faint outline at once (a fast start may hide the splash
         mid-draw), the outline drawing over it, then a highlight sweeping across. -->
    <style>
      [data-component="startup-splash"] [data-slot="draw"] path {
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: buff-brain-draw 650ms cubic-bezier(0.65, 0, 0.35, 1) forwards;
      }
      [data-component="startup-splash"] [data-slot="sweep"] {
        opacity: 0;
        animation: buff-brain-sweep 1ms 700ms forwards;
      }
      @keyframes buff-brain-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes buff-brain-sweep {
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        [data-component="startup-splash"] [data-slot="draw"] path {
          animation: none;
          stroke-dashoffset: 0;
        }
        [data-component="startup-splash"] [data-slot="sweep"] {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <!-- The splash until the window mounts over it (the Solid window's startup splash). -->
      <div
        data-component="startup-splash"
        style="position: fixed; inset: 0; display: flex; align-items: center; justify-content: center"
      >
        <svg
          width="72"
          height="72"
          viewBox="0 0 24 24"
          fill="none"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <defs>
            <linearGradient id="buff-brain-sweep" gradientUnits="userSpaceOnUse" x1="-12" y1="0" x2="0" y2="0">
              <stop offset="0" stop-color="#2563EB" stop-opacity="0" />
              <stop offset="0.5" stop-color="#BFDBFE" />
              <stop offset="1" stop-color="#2563EB" stop-opacity="0" />
              <animateTransform
                attributeName="gradientTransform"
                type="translate"
                values="-6 0; 42 0; 42 0"
                keyTimes="0; 0.6; 1"
                dur="1.8s"
                begin="0.7s"
                repeatCount="indefinite"
              />
            </linearGradient>
          </defs>
          <g stroke="#2563EB" opacity="0.22">
            <path pathLength="1" d="M12 18V5" />
            <path pathLength="1" d="M15 13a4.17 4.17 0 0 1-3-4 4.17 4.17 0 0 1-3 4" />
            <path pathLength="1" d="M17.598 6.5A3 3 0 1 0 12 5a3 3 0 1 0-5.598 1.5" />
            <path pathLength="1" d="M17.997 5.125a4 4 0 0 1 2.526 5.77" />
            <path pathLength="1" d="M18 18a4 4 0 0 0 2-7.464" />
            <path pathLength="1" d="M19.967 17.483A4 4 0 1 1 12 18a4 4 0 1 1-7.967-.517" />
            <path pathLength="1" d="M6 18a4 4 0 0 1-2-7.464" />
            <path pathLength="1" d="M6.003 5.125a4 4 0 0 0-2.526 5.77" />
          </g>
          <g data-slot="draw" stroke="#2563EB">
            <path pathLength="1" style="animation-delay: 0ms" d="M12 18V5" />
            <path pathLength="1" style="animation-delay: 40ms" d="M15 13a4.17 4.17 0 0 1-3-4 4.17 4.17 0 0 1-3 4" />
            <path pathLength="1" style="animation-delay: 80ms" d="M17.598 6.5A3 3 0 1 0 12 5a3 3 0 1 0-5.598 1.5" />
            <path pathLength="1" style="animation-delay: 120ms" d="M17.997 5.125a4 4 0 0 1 2.526 5.77" />
            <path pathLength="1" style="animation-delay: 160ms" d="M18 18a4 4 0 0 0 2-7.464" />
            <path pathLength="1" style="animation-delay: 200ms" d="M19.967 17.483A4 4 0 1 1 12 18a4 4 0 1 1-7.967-.517" />
            <path pathLength="1" style="animation-delay: 240ms" d="M6 18a4 4 0 0 1-2-7.464" />
            <path pathLength="1" style="animation-delay: 280ms" d="M6.003 5.125a4 4 0 0 0-2.526 5.77" />
          </g>
          <g data-slot="sweep" stroke="url(#buff-brain-sweep)">
            <path pathLength="1" d="M12 18V5" />
            <path pathLength="1" d="M15 13a4.17 4.17 0 0 1-3-4 4.17 4.17 0 0 1-3 4" />
            <path pathLength="1" d="M17.598 6.5A3 3 0 1 0 12 5a3 3 0 1 0-5.598 1.5" />
            <path pathLength="1" d="M17.997 5.125a4 4 0 0 1 2.526 5.77" />
            <path pathLength="1" d="M18 18a4 4 0 0 0 2-7.464" />
            <path pathLength="1" d="M19.967 17.483A4 4 0 1 1 12 18a4 4 0 1 1-7.967-.517" />
            <path pathLength="1" d="M6 18a4 4 0 0 1-2-7.464" />
            <path pathLength="1" d="M6.003 5.125a4 4 0 0 0-2.526 5.77" />
          </g>
        </svg>
      </div>
    </div>
    <script src="../renderer-react/index.ts" type="module"></script>
  </body>
</html>
